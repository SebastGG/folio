steps:
  - name: build-and-push
    image: docker:dind
    privileged: true
    # Nur main deployt. Ohne den Filter baute und deployte jeder Push auf irgendeinen
    # Branch — ein unfertiger Feature-Branch ginge so in Produktion.
    when:
      event: [push, manual]
      branch: main
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - docker login registry.gtech01.de -u $REGISTRY_USER -p $REGISTRY_PASSWORD
      - docker build --build-arg BUILD_HASH=${CI_COMMIT_SHA} -t registry.gtech01.de/folio:latest .
      - docker push registry.gtech01.de/folio:latest

  - name: deploy
    image: alpine
    # nur main, siehe oben
    when:
      event: [push, manual]
      branch: main
    environment:
      CLOUDRON_TOKEN:
        from_secret: cloudron_token
    commands:
      - apk add --no-cache curl jq
      - APP_ID=$(curl -s -H "Authorization:Bearer $CLOUDRON_TOKEN" https://my.gtech01.de/api/v1/apps | jq -r '.apps[] | select(.fqdn=="folio.gtech01.de") | .id')
      - echo "App ID is $APP_ID"
      - curl -s -H "Authorization:Bearer $CLOUDRON_TOKEN" https://my.gtech01.de/api/v1/apps/$APP_ID | jq -c '{manifest:.manifest}' > /tmp/manifest.json
      - curl -s -X POST -H "Authorization:Bearer $CLOUDRON_TOKEN" -H "Content-Type:application/json" -d @/tmp/manifest.json https://my.gtech01.de/api/v1/apps/$APP_ID/update