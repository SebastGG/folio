steps:
  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      event: [push, manual]
    settings:
      registry: registry.gtech01.de
      repo: registry.gtech01.de/folio
      tags: latest
      username:
        from_secret: registry_user      
      password:
        from_secret: registry_password